name: Factory fixture
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p fixture; echo disposable > fixture/result.txt
      - uses: actions/upload-artifact@v4
        with:
          name: factory-fixture
          path: fixture/result.txt
